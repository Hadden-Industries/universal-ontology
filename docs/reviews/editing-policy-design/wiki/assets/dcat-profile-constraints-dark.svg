<svg xmlns="http://www.w3.org/2000/svg" width="980" height="601" viewBox="0 0 980 601" role="img" aria-labelledby="title desc">
<title id="title">Dataset and distribution: selected structural constraints</title><desc id="desc">Datasets and distributions require their respective explicit DCAT type and owl NamedIndividual type. Dataset distribution links are optional IRIs whose targets are explicitly typed in the local validated module set. Required metadata and cardinalities are shown; full rules remain in the reference.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8B98A7" stroke-width="1.5"/></marker></defs>
<rect width="980" height="601" rx="14" fill="#0D1117"/>
<text x="24" y="34" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="650">Dataset and distribution: selected structural constraints</text>
<text x="24" y="74" fill="#79C0FF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="650">dcat:distribution  0..* IRI values → explicitly typed local distribution targets</text>
<rect x="24" y="109" width="450" height="351" rx="10" fill="#161B22" stroke="#8B98A7" stroke-width="1.5"/>
<rect x="25" y="121" width="4" height="30" rx="2" fill="#79C0FF"/>
<text x="42" y="142" fill="#79C0FF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="650">Dataset</text>
<text x="42" y="175" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">rdf:type: owl:NamedIndividual</text>
<text x="42" y="201" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">rdf:type: dcat:Dataset</text>
<text x="42" y="227" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">IRI: dataset/{canonical lowercase UUID v4}</text>
<text x="42" y="253" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">dcat:theme: 1..* IRI values</text>
<text x="42" y="279" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">dcterms:title: 1..* language-tagged values</text>
<text x="42" y="305" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">dcterms:description: 1..* language-tagged values</text>
<text x="42" y="331" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">rdfs:label: 1..* language-tagged values</text>
<text x="42" y="357" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">All three text fields: non-blank</text>
<text x="42" y="383" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">Description: at most one per language tag</text>
<rect x="505" y="109" width="451" height="351" rx="10" fill="#161B22" stroke="#8B98A7" stroke-width="1.5"/>
<rect x="506" y="121" width="4" height="30" rx="2" fill="#7EE2C6"/>
<text x="523" y="142" fill="#7EE2C6" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="650">Distribution</text>
<text x="523" y="175" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">rdf:type: owl:NamedIndividual</text>
<text x="523" y="201" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">rdf:type: dcat:Distribution</text>
<text x="523" y="227" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">IRI: distribution/{canonical lowercase UUID v4}</text>
<text x="523" y="253" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">dcat:accessURL: 1..* IRI values</text>
<text x="523" y="279" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">rdfs:label: 1..* language-tagged values</text>
<text x="523" y="305" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">Every label: non-blank</text>
<text x="523" y="331" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">dcat:downloadURL: 0..* IRI values</text>
<text x="523" y="357" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">Each supplied value is checked.</text>
<text x="523" y="383" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">No remote fetch supplies the target declaration.</text>
<text x="24" y="504" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400">Base IRI for both profiles: https://haddenindustries.com/ontology/</text>
<text x="24" y="535" fill="#ADB9C7" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400">1..* means at least one; 0..* means optional and repeatable.</text>
<text x="24" y="566" fill="#ADB9C7" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="400">These are validation constraints, not a claim that the ontology contains OWL cardinality axioms.</text>
</svg>