<svg xmlns="http://www.w3.org/2000/svg" width="980" height="492" viewBox="0 0 980 492" role="img" aria-labelledby="title desc">
<title id="title">Preferred names connect human language to the local name</title><desc id="desc">For an ordinary owned entity RiskEvent, the preferred label Risk event in English also appears as an rdfs label with identical text and language. At least one English preferred label must correspond to the local name after the stated normalization.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8B98A7" stroke-width="1.5"/></marker></defs>
<rect width="980" height="492" rx="14" fill="#0D1117"/>
<text x="24" y="34" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="650">Preferred names connect human language to the local name</text>
<rect x="24" y="165" width="245" height="146" rx="10" fill="#161B22" stroke="#8B98A7" stroke-width="1.5"/>
<rect x="25" y="177" width="4" height="30" rx="2" fill="#79C0FF"/>
<text x="42" y="198" fill="#79C0FF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="650">Owned entity</text>
<text x="42" y="231" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400">Local name:</text>
<text x="42" y="257" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400">RiskEvent</text>
<rect x="588" y="81" width="367" height="125" rx="10" fill="#161B22" stroke="#8B98A7" stroke-width="1.5"/>
<rect x="589" y="93" width="4" height="30" rx="2" fill="#79C0FF"/>
<text x="606" y="114" fill="#79C0FF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="650">skos:prefLabel</text>
<text x="606" y="147" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400">&quot;Risk event&quot;@en</text>
<text x="606" y="173" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400">At most one per language tag.</text>
<rect x="588" y="299" width="367" height="125" rx="10" fill="#161B22" stroke="#8B98A7" stroke-width="1.5"/>
<rect x="589" y="311" width="4" height="30" rx="2" fill="#79C0FF"/>
<text x="606" y="332" fill="#79C0FF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="650">rdfs:label</text>
<text x="606" y="365" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400">&quot;Risk event&quot;@en</text>
<text x="606" y="391" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400">Additional labels are allowed.</text>
<path d="M269,200 L320,200 L320,144 L579,144" fill="none" stroke="#8B98A7" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M269,270 L320,270 L320,361 L579,361" fill="none" stroke="#8B98A7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="333" y="118" fill="#79C0FF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="400">At least one English variant</text>
<text x="333" y="338" fill="#79C0FF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="400">At least one label</text>
<path d="M605,206 L560,206 L560,326 L579,326" fill="none" stroke="#8B98A7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="588" y="240" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="650">Every preferred label is repeated exactly:</text>
<text x="588" y="266" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="400">same text AND same language tag.</text>
<text x="24" y="465" fill="#ADB9C7" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400">Name correspondence is a separate comparison; identical labels are not normalized.</text>
</svg>