<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTML representation of the ontology.">
    <title>Ontology</title>
    <!-- Link to our shared premium stylesheet -->
    <link rel="stylesheet" href="/ontology/ontology.css">
</head>
<body>

    <main class="table-wrapper">
        <div class="toolbar">
            <div class="dropdown" id="col-dropdown" aria-label="Filter Columns" title="Filter Columns">
                <button class="dropdown-toggle" id="col-toggle">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    Columns
                </button>
                <div class="dropdown-menu" id="col-menu">
                    <!-- Checkboxes injected via JavaScript -->
                </div>
            </div>
            <div class="dropdown" id="export-dropdown">
                <button class="dropdown-toggle" id="export-toggle" aria-label="Export data" title="Export data">
                    <svg  xmlns="http://www.w3.org/2000/svg"  width="14"  height="14"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" /><polyline points="16 6 12 2 8 6" /><line x1="12" y1="2" x2="12" y2="15" /></svg>
                    Export
                </button>
                <div class="dropdown-menu" id="export-menu">
                    <button class="dropdown-button" id="export-csv" type="button" title="Export .csv">Comma-Separated Values<br/>(.csv)</button>
                    <button class="dropdown-button" id="export-jsonld" type="button" title="Export .jsonld"><abbr title="JavaScript Object Notation">JSON</abbr> for Linked Data<br/>(.jsonld)</button>
                    <button class="dropdown-button" id="export-xmi" type="button" title="Export .xmi"><abbr title="Extensible Markup Language">XML</abbr> Metadata Interchange<br/>(.xmi)</button>
                </div>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th scope="col" data-sort="objectType">Entity Type</th>
                        <th scope="col" title="Universally Unique Identifier" data-sort="uuid">UUID</th>
                        <th scope="col" title="Uniform Resource Identifier" data-sort="uri">URI</th>
                        <th scope="col" data-sort="preferredLabel">Preferred Label</th>
                        <th scope="col" data-sort="definition">Definition</th>
                        <th scope="col" data-sort="sources">Sources</th>
                        <th scope="col" data-sort="creator">Creator</th>
                        <th scope="col" data-sort="createdAt">Created At</th>
                        <th scope="col" data-sort="modifiedAt">Modified At</th>
                        <th scope="col" data-sort="subClassOf">Superclasses</th>
                        <th scope="col" data-sort="classOfNamedIndividual">Class of Named Individual</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Rows injected via JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Import the shared logic library -->
    <script src="/ontology/ontology.js"></script>
</body>
</html>
