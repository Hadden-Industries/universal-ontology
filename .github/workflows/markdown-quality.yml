name: Trusted Markdown qualification

on:
  workflow_dispatch:
    inputs:
      candidate_repository:
        description: Public candidate repository; content is inspected only as data
        required: true
        default: Hadden-Industries/universal-ontology
        type: string
      candidate_sha:
        description: Exact 40-character candidate commit to qualify
        required: true
        type: string
      trusted_sha:
        description: Exact reviewed 40-character UO policy, profile and toolchain commit
        required: true
        type: string

permissions: {}

jobs:
  qualify:
    uses: Hadden-Industries/markdown-quality/.github/workflows/markdown-quality.yml@7e24e6f806d9d532c1425f76c52fdd0923af985a
    permissions:
      contents: read
    with:
      trusted-repository: ${{ github.repository }}
      trusted-sha: ${{ inputs.trusted_sha }}
      candidate-repository: ${{ inputs.candidate_repository }}
      candidate-sha: ${{ inputs.candidate_sha }}
