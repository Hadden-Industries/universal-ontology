name: Full qualification
on:
  workflow_dispatch: null
  workflow_call:
    inputs:
      include_mcp_packages:
        type: boolean
        default: false
    outputs:
      verified-revision:
        value: ${{ jobs.checks.outputs.verified-revision }}
      software-version:
        value: ${{ jobs.checks.outputs.software-version }}
      candidate-sha256:
        value: ${{ jobs.checks.outputs.candidate-sha256 }}
      artifact-id:
        value: ${{ jobs.checks.outputs.artifact-id }}
      artifact-digest:
        value: ${{ jobs.checks.outputs.artifact-digest }}
  schedule:
    - cron: 17 4 * * 3
permissions: {}
cache-mode: read
jobs:
  checks:
    uses: ./.github/workflows/repository-checks.yml
    with:
      include_mcp_packages: ${{ inputs.include_mcp_packages || false }}
    permissions:
      contents: read
      actions: read
    cache-mode: read
