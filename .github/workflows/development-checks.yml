name: Development checks
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    outputs:
      verified-revision:
        value: ${{ jobs.complete.outputs.verified-revision }}
permissions: {}
jobs:
  scope:
    timeout-minutes: 5
    name: Select relevant checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      development: ${{ steps.scope.outputs.development }}
      documentation: ${{ steps.scope.outputs.documentation }}
      python_style: ${{ steps.scope.outputs.python_style }}
      python_tests: ${{ steps.scope.outputs.python_tests }}
      python_setup_tests: ${{ steps.scope.outputs.python_setup_tests }}
      agent_skills_lock: ${{ steps.scope.outputs.agent_skills_lock }}
      style_tooling: ${{ steps.scope.outputs.style_tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - name: Compare PR inputs before installing dependencies
        id: scope
        run: node scripts/evaluatePullRequestChecks.js --scopes
    cache-mode: none
  documentation:
    timeout-minutes: 10
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    name: Markdown documents (${{ matrix.os }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - name: Select package manager
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.2.0
          test "$(npm --version)" = "12.2.0"
      - name: Install only the locked documentation tools
        shell: bash
        run: npm run install:markdown
      - name: Check every repository Markdown document
        run: npm run check:markdown
    permissions:
      contents: read
  python-style:
    timeout-minutes: 10
    name: Python style
    needs: scope
    if: needs.scope.outputs.python_style == 'true' && needs.scope.outputs.style_tooling != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - name: Install only the hash-locked Python style tool
        run: |
          node scripts/preparePythonStyleTools.js --output "$RUNNER_TEMP/python-style-tools"
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/python-style-tools/requirements.txt"
          .venv/bin/python -m pip check
          .venv/bin/python -c "from importlib.metadata import requires; assert not requires('ruff'), 'Ruff dependency closure needs review'"
      - name: Select package manager
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.2.0
          test "$(npm --version)" = "12.2.0"
      - name: Check Python sources
        run: npm run lint:python && npm run format:python:check
    permissions:
      contents: read
    cache-mode: none
  python-tests:
    timeout-minutes: 30
    name: Python-only tests (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.python_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - name: Set up only the locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_executable=.venv/Scripts/python.exe
          else
            python_executable=.venv/bin/python
          fi
          "$python_executable" -m pip install --require-hashes --only-binary=:all: --no-binary=pyyaml -r requirements.lock.txt
          "$python_executable" -m pip check
      - name: Select package manager
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.2.0
          test "$(npm --version)" = "12.2.0"
      - name: Install the isolated generated-document formatter
        run: npm run install:markdown
      - name: Run the Python-only native family
        run: npm run test:python -- --family python-only
    permissions:
      contents: read
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-2025' && 'pwsh' || 'bash' }}
  python-node-tests:
    timeout-minutes: 30
    name: Node-backed Python tests (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.python_setup_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - name: Select package manager
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.2.0
          test "$(npm --version)" = "12.2.0"
      - name: Set up the locked development environment
        run: npm run set-up:development
      - name: Run the Node-backed native family
        run: npm run test:python -- --family node-backed
    permissions:
      contents: read
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-2025' && 'pwsh' || 'bash' }}
  agent-skills-lock:
    timeout-minutes: 5
    name: Agent Skills lock
    needs: scope
    if: needs.scope.outputs.agent_skills_lock == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - name: Validate the committed Agent Skills lock
        run: python -B -m unittest tests.test_set_up_agent_skills.CommittedSkillsLockTests -v
    permissions:
      contents: read
    cache-mode: none
  style-tooling:
    timeout-minutes: 30
    name: Style toolchain (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.style_tooling == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - name: Select package manager
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.2.0
          test "$(npm --version)" = "12.2.0"
      - name: Set up the locked development environment
        run: npm run set-up:development
      - name: Check Python style and formatter regressions
        run: npm run lint:python && npm run format:python:check
      - name: Check minimal documentation installation inputs
        run: npm test -- --runInBand --runTestsByPath tests/python-style-tools.test.js tests/markdown-quality.test.js
    permissions:
      contents: read
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-2025' && 'pwsh' || 'bash' }}
  checks:
    name: Development controls
    timeout-minutes: 30
    needs: scope
    if: needs.scope.outputs.development == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - name: Select package manager
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.2.0
          test "$(npm --version)" = "12.2.0"
      - name: Set up development from the clean checkout
        run: npm run set-up:development
      - name: Verify the installed ontology runner
        run: node scripts/runRepositoryPython.js -m unittest tests.test_validate_ontologies -v
        if: "!fromJSON(inputs.plan).scopes.python_tests"
      - name: Test the optional Python setup tools
        run: node scripts/runRepositoryPython.js -m unittest discover -s tests -p "test_set_up_*.py"
        if: "!fromJSON(inputs.plan).scopes.python_setup_tests"
      - name: Test development setup, launcher, hooks and check selection
        run: npm test -- --runInBand tests/configure-git-hooks.test.js tests/set-up-development-environment.test.js tests/run-repository-python.test.js tests/development-workflow.test.js tests/pr-check-scopes.test.js
    permissions:
      contents: read
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-2025' && 'pwsh' || 'bash' }}
  complete:
    name: Verify internal completion
    if: ${{ always() }}
    needs:
      - scope
      - documentation
      - python-style
      - python-tests
      - python-node-tests
      - agent-skills-lock
      - style-tooling
      - checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    cache-mode: none
    outputs:
      verified-revision: ${{ steps.complete.outputs.verified-revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: complete
        if: ${{ success() && !cancelled() }}
        env:
          PR_CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/evaluatePullRequestChecks.js --consumer development
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        run: exit 1
defaults:
  run:
    shell: bash
cache-mode: read
env:
  PR_CHECK_PLAN: ${{ inputs.plan }}
  PR_CHECK_MODE: ${{ fromJSON(inputs.plan).mode }}
