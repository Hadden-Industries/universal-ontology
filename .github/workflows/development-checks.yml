name: Development checks
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    outputs:
      verified-revision:
        value: ${{ jobs.complete.outputs.verified-revision }}
permissions: {}
jobs:
  scope:
    timeout-minutes: 5
    name: Select relevant checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      development: ${{ steps.scope.outputs.development }}
      documentation: ${{ steps.scope.outputs.documentation }}
      python_style: ${{ steps.scope.outputs.python_style }}
      python_tests: ${{ steps.scope.outputs.python_tests }}
      agent_skills_lock: ${{ steps.scope.outputs.agent_skills_lock }}
      style_tooling: ${{ steps.scope.outputs.style_tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - name: Compare PR inputs before installing dependencies
        id: scope
        run: node scripts/evaluatePullRequestChecks.js --scopes
    cache-mode: none
  documentation:
    timeout-minutes: 10
    name: Markdown documents
    needs: scope
    if: needs.scope.outputs.documentation == 'true' || needs.scope.outputs.style_tooling == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install only the locked documentation tools
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepareDocumentationTools.js --output "$RUNNER_TEMP/documentation-tools"
          npm ci --prefix "$RUNNER_TEMP/documentation-tools" --ignore-scripts --no-audit --no-fund
          mkdir node_modules
          cp -R "$RUNNER_TEMP/documentation-tools/node_modules/prettier" node_modules/prettier
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/documentation-tools/requirements.txt"
      - name: Check authored documents
        env:
          DOCUMENTATION_CHECK_ALL: ${{ fromJSON(inputs.plan).mode == 'full' || needs.scope.outputs.style_tooling == 'true' }}
          DOCUMENTATION_DIFF_BASE: ${{ fromJSON(inputs.plan).comparisonBase }}
          DOCUMENTATION_DIFF_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DOCUMENTATION_CHECK_ALL" == "true" ]]; then
            npm run format:docs:check
          else
            npm run format:docs:check -- --base "$DOCUMENTATION_DIFF_BASE" --head "$DOCUMENTATION_DIFF_HEAD"
          fi
    permissions:
      contents: read
  python-style:
    timeout-minutes: 10
    name: Python style
    needs: scope
    if: needs.scope.outputs.python_style == 'true' && needs.scope.outputs.style_tooling != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install only the hash-locked Python style tool
        run: |
          node scripts/preparePythonStyleTools.js --output "$RUNNER_TEMP/python-style-tools"
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/python-style-tools/requirements.txt"
          .venv/bin/python -m pip check
          .venv/bin/python -c "from importlib.metadata import requires; assert not requires('ruff'), 'Ruff dependency closure needs review'"
      - name: Check Python sources
        run: npm run lint:python && npm run format:python:check
    permissions:
      contents: read
    cache-mode: none
  python-tests:
    timeout-minutes: 30
    name: Python tests (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.python_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Select package manager
        run: npm install --global --no-audit --no-fund npm@12.0.2
      - name: Set up the locked development environment
        run: npm run set-up:development
      - name: Run the whole Python test suite
        run: npm run test:python
    permissions:
      contents: read
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-2025' && 'pwsh' || 'bash' }}
  agent-skills-lock:
    timeout-minutes: 5
    name: Agent Skills lock
    needs: scope
    if: needs.scope.outputs.agent_skills_lock == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Validate the committed Agent Skills lock
        run: python -B -m unittest tests.test_set_up_agent_skills.CommittedSkillsLockTests -v
    permissions:
      contents: read
    cache-mode: none
  style-tooling:
    timeout-minutes: 30
    name: Style toolchain (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.style_tooling == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Select package manager
        run: npm install --global --no-audit --no-fund npm@12.0.2
      - name: Set up the locked development environment
        run: npm run set-up:development
      - name: Check Python style and formatter regressions
        run: npm run lint:python && npm run format:python:check && npm run test:prose
      - name: Check minimal documentation installation inputs
        run: npm test -- --runInBand --runTestsByPath tests/documentation-tools.test.js tests/python-style-tools.test.js
    permissions:
      contents: read
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-2025' && 'pwsh' || 'bash' }}
  checks:
    timeout-minutes: 30
    needs: scope
    if: needs.scope.outputs.development == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Select package manager
        run: npm install --global --no-audit --no-fund npm@12.0.2
      - name: Set up development from the clean checkout
        run: npm run set-up:development
      - name: Verify the installed ontology runner
        run: node scripts/runRepositoryPython.js -m unittest tests.test_validate_ontologies -v
        if: "!fromJSON(inputs.plan).scopes.python_tests"
      - name: Test the optional Python setup tools
        run: node scripts/runRepositoryPython.js -m unittest discover -s tests -p "test_set_up_*.py"
        if: "!fromJSON(inputs.plan).scopes.python_tests"
      - name: Test development setup, launcher, hooks and check selection
        run: npm test -- --runInBand tests/configure-git-hooks.test.js tests/set-up-development-environment.test.js tests/run-repository-python.test.js tests/development-workflow.test.js tests/pr-check-scopes.test.js
    permissions:
      contents: read
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-2025' && 'pwsh' || 'bash' }}
  complete:
    name: Verify internal completion
    if: ${{ always() }}
    needs:
      - scope
      - documentation
      - python-style
      - python-tests
      - agent-skills-lock
      - style-tooling
      - checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    cache-mode: none
    outputs:
      verified-revision: ${{ steps.complete.outputs.verified-revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: complete
        if: ${{ success() && !cancelled() }}
        env:
          PR_CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/evaluatePullRequestChecks.js --consumer development
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        run: exit 1
defaults:
  run:
    shell: bash
cache-mode: read
env:
  PR_CHECK_PLAN: ${{ inputs.plan }}
  PR_CHECK_MODE: ${{ fromJSON(inputs.plan).mode }}
