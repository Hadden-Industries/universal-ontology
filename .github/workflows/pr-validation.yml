name: PR validation
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions: {}
defaults:
  run:
    shell: bash
cache-mode: read
concurrency:
  group: pr-validation-${{ github.event_name }}-${{ github.event.pull_request.number || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    outputs:
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: select
        env:
          MCP_PACKAGE_CI_ENABLED: ${{ vars.MCP_PACKAGE_CI_ENABLED }}
        run: node scripts/selectPullRequestChecks.js --plan
  node:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    cache-mode: none
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && contains(fromJSON(needs.select.outputs.plan).requiredJobs, 'node') }}
    env:
      PR_CHECK_PLAN: ${{ needs.select.outputs.plan }}
    outputs:
      verified-revision: ${{ steps.complete.outputs.verified-revision }}
      native-coverage: ${{ steps.node-tests.outputs.native-coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Static checks
        run: |-
          npm run lint:node
          npm run format:node:check
      - id: node-tests
        run: node scripts/runPullRequestNodeChecks.js
      - id: complete
        run: echo "verified-revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  website:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    cache-mode: none
    needs:
      - select
      - node
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.node.result == 'success' && contains(fromJSON(needs.select.outputs.plan).requiredJobs, 'website') }}
    env:
      PR_CHECK_PLAN: ${{ needs.select.outputs.plan }}
    outputs:
      verified-revision: ${{ steps.complete.outputs.verified-revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:verify
      - id: complete
        run: echo "verified-revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  development:
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && contains(fromJSON(needs.select.outputs.plan).requiredJobs, 'development') }}
    uses: ./.github/workflows/development-checks.yml
    with:
      plan: ${{ needs.select.outputs.plan }}
    permissions:
      contents: read
    cache-mode: read
  ontology:
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && contains(fromJSON(needs.select.outputs.plan).requiredJobs, 'ontology') }}
    uses: ./.github/workflows/ontology-validation.yml
    with:
      plan: ${{ needs.select.outputs.plan }}
    permissions:
      contents: read
    cache-mode: read
  distribution:
    needs:
      - select
      - node
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.node.result == 'success' || needs.node.result == 'skipped') && contains(fromJSON(needs.select.outputs.plan).requiredJobs, 'distribution') }}
    uses: ./.github/workflows/verify-universal-ontology-mcp-distribution.yml
    with:
      plan: ${{ needs.select.outputs.plan }}
    permissions:
      contents: read
    cache-mode: none
  gate:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    name: PR validation
    needs:
      - select
      - development
      - ontology
      - node
      - website
      - distribution
    if: ${{ always() }}
    env:
      PR_CHECK_PLAN: ${{ needs.select.outputs.plan }}
      PR_CHECK_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - if: ${{ success() && !cancelled() }}
        run: node scripts/evaluatePullRequestChecks.js
      - id: record
        if: ${{ success() && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NATIVE_NODE_COVERAGE: ${{ needs.node.outputs.native-coverage }}
        run: node scripts/prQualificationCommand.js record
      - name: Retain selected PR qualification
        if: ${{ success() && !cancelled() && steps.record.outputs.recorded == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uo-pr-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uo-pr-qualification-${{ github.run_id }}-${{ github.run_attempt }}/qualification.json
          if-no-files-found: error
          retention-days: 3
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        run: exit 1
