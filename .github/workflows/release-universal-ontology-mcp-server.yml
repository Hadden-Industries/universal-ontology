name: Release Universal Ontology MCP Server

on:
  pull_request:
    paths:
      - ".github/workflows/release-universal-ontology-mcp-server.yml"
      - "docs/mcp/**"
      - "package.json"
      - "package-lock.json"
      - "packages/universal-ontology-mcp-server/**"
      - "scripts/build/createOntologyQueryArtifacts.js"
      - "scripts/build/ontologyAssets.js"
      - "scripts/distribution/**"
      - "scripts/generateOntologyQueryIndexes.js"
      - "scripts/runUniversalOntologyMcpStdioServer.js"
      - "scripts/stageOntologyQueryArtifactChannel.js"
      - "server.json"
      - "src/mcp/**"
      - "src/ontology.js"
      - "src/ontologyQuery/**"
      - "tests/distribution/**"
      - "tests/mcp/**"
      - "tests/ontology-query/**"
      - "tests/webmcp/ontology-entity-definition-resolver.test.js"
  push:
    branches: ["**"]
    tags: ["universal-ontology-mcp-server-v*"]
    paths:
      - ".github/workflows/release-universal-ontology-mcp-server.yml"
      - "docs/mcp/**"
      - "package.json"
      - "package-lock.json"
      - "packages/universal-ontology-mcp-server/**"
      - "scripts/build/createOntologyQueryArtifacts.js"
      - "scripts/build/ontologyAssets.js"
      - "scripts/distribution/**"
      - "scripts/generateOntologyQueryIndexes.js"
      - "scripts/runUniversalOntologyMcpStdioServer.js"
      - "scripts/stageOntologyQueryArtifactChannel.js"
      - "server.json"
      - "src/mcp/**"
      - "src/ontology.js"
      - "src/ontologyQuery/**"
      - "tests/distribution/**"
      - "tests/mcp/**"
      - "tests/ontology-query/**"
      - "tests/webmcp/ontology-entity-definition-resolver.test.js"

# Default-deny token capabilities; every job grants only its own minimum set.
permissions: {}

concurrency:
  group: universal-ontology-mcp-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      is-release: ${{ steps.release-metadata.outputs.is-release }}
      software-version: ${{ steps.release-metadata.outputs.software-version }}
      source-date-epoch: ${{ steps.release-metadata.outputs.source-date-epoch }}
      target-matrix: ${{ steps.release-metadata.outputs.target-matrix }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Select exact npm CLI
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          test "$(npm --version)" = "12.0.2"

      - name: Install the exact locked dependency graph
        run: npm ci --ignore-scripts

      - name: Validate tag and derive immutable build metadata
        id: release-metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";

          const rootPackage = JSON.parse(readFileSync("package.json", "utf8"));
          const publicPackage = JSON.parse(
            readFileSync("packages/universal-ontology-mcp-server/package.json", "utf8"),
          );
          const serverDocument = JSON.parse(readFileSync("server.json", "utf8"));
          const releaseInputs = JSON.parse(
            readFileSync(
              "scripts/distribution/universalOntologyMcpReleaseInputs.json",
              "utf8",
            ),
          );
          const releaseTagPattern = /^universal-ontology-mcp-server-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u;
          const isTag = process.env.GITHUB_REF_TYPE === "tag";
          const tagMatch = isTag
            ? releaseTagPattern.exec(process.env.GITHUB_REF_NAME)
            : null;
          if (isTag && !tagMatch) {
            throw new Error("The release ref is not an exact semantic-version tag.");
          }
          const tagVersion = tagMatch
            ? `${tagMatch[1]}.${tagMatch[2]}.${tagMatch[3]}`
            : rootPackage.version;
          const versions = [
            rootPackage.version,
            publicPackage.version,
            serverDocument.version,
            ...serverDocument.packages
              .map(({ version }) => version)
              .filter((version) => version !== undefined),
          ];
          if (versions.some((version) => version !== tagVersion)) {
            throw new Error("Tag, package, and Registry versions disagree.");
          }
          if (
            rootPackage.packageManager !==
              `npm@${releaseInputs.selectedNpmVersion}` ||
            publicPackage.mcpName !== serverDocument.name
          ) {
            throw new Error("Release toolchain or Registry ownership disagrees.");
          }
          const targetMatrix = releaseInputs.nodeRuntime.targets.map(
            ({ targetName, runnerLabel, releaseArchiveFormat }) => ({
              targetName,
              runnerLabel,
              releaseArchiveFormat,
            }),
          );
          const sourceDateEpoch = execFileSync(
            "git",
            ["show", "-s", "--format=%ct", "HEAD"],
            { encoding: "utf8" },
          ).trim();
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `is-release=${isTag}`,
              `software-version=${rootPackage.version}`,
              `source-date-epoch=${sourceDateEpoch}`,
              `target-matrix=${JSON.stringify(targetMatrix)}`,
              "",
            ].join("\n"),
          );
          NODE

      - name: Run repository verification
        run: |
          npm test -- --runInBand
          npm run lint
          npm run format:check
          npm run build
          npm run mcp:package:build

      - name: Smoke-test the public stable Person definition
        if: steps.release-metadata.outputs.is-release == 'true'
        run: >-
          node scripts/distribution/smokeTestUniversalOntologyMcpPublicArtifactOrigin.js
          --artifact-channel=stable

  archive:
    name: Archive ${{ matrix.targetName }}
    needs: validate
    runs-on: ${{ matrix.runnerLabel }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.target-matrix) }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Select exact npm CLI
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          test "$(npm --version)" = "12.0.2"

      - name: Install the exact locked dependency graph
        run: npm ci --ignore-scripts

      - name: Build the native self-contained archive
        run: npm run mcp:archives:build -- --target=${{ matrix.targetName }}

      - name: Smoke-test the extracted Unix runtime and application
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive_root="universal-ontology-mcp-server-v${{ needs.validate.outputs.software-version }}-${{ matrix.targetName }}"
          archive_path="dist/releases/${archive_root}.tar.gz"
          extraction_path="${RUNNER_TEMP}/universal-ontology-mcp-server"
          mkdir --parents "${extraction_path}"
          tar --extract --gzip --file "${archive_path}" --directory "${extraction_path}"
          runtime_path="${extraction_path}/${archive_root}/runtime/bin/node"
          application_path="${extraction_path}/${archive_root}/app/universal-ontology-mcp-server.mjs"
          test "$("${runtime_path}" --version)" = "v24.20.0"
          "${runtime_path}" "${application_path}" --help | grep --fixed-strings "universal-ontology-mcp-server [options]"

      - name: Smoke-test the extracted Windows runtime and application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archiveRoot = "universal-ontology-mcp-server-v${{ needs.validate.outputs.software-version }}-${{ matrix.targetName }}"
          $archivePath = "dist/releases/$archiveRoot.zip"
          $extractionPath = Join-Path $env:RUNNER_TEMP "universal-ontology-mcp-server"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractionPath
          $runtimePath = Join-Path $extractionPath "$archiveRoot/runtime/node.exe"
          $applicationPath = Join-Path $extractionPath "$archiveRoot/app/universal-ontology-mcp-server.mjs"
          if ((& $runtimePath --version) -ne "v24.20.0") {
            throw "The packaged Node runtime version disagrees."
          }
          $helpText = & $runtimePath $applicationPath --help | Out-String
          if (-not $helpText.Contains("universal-ontology-mcp-server [options]")) {
            throw "The packaged application help smoke failed."
          }

      - name: Upload the verified native archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: universal-ontology-mcp-server-${{ matrix.targetName }}
          path: dist/releases/universal-ontology-mcp-server-v${{ needs.validate.outputs.software-version }}-${{ matrix.targetName }}.${{ matrix.releaseArchiveFormat }}
          if-no-files-found: error
          retention-days: 3

  assemble:
    name: Assemble and verify release candidate
    needs: [archive, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Select exact npm CLI
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          test "$(npm --version)" = "12.0.2"

      - name: Install the exact locked dependency graph
        run: npm ci --ignore-scripts

      - name: Download all native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: universal-ontology-mcp-server-*
          path: dist/releases
          merge-multiple: true

      - name: Build and pack the npm artifact
        run: |
          npm run mcp:package:build
          npm run mcp:package:pack

      - name: Generate independent npm and release SPDX documents
        shell: bash
        run: |
          mkdir --parents dist/release-work
          npm sbom --workspace universal-ontology-mcp-server --sbom-format spdx --sbom-type application > dist/release-work/npm-workspace.spdx.json
          npm run mcp:sbom:create

      - name: Verify the complete release candidate
        run: >-
          npm run mcp:release:verify --
          --tag "universal-ontology-mcp-server-v${{ needs.validate.outputs.software-version }}"
          --release-directory dist/releases
          --npm-comparison-sbom dist/release-work/npm-workspace.spdx.json

      - name: Upload the immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: universal-ontology-mcp-server-release-candidate
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 3

  attest-and-draft:
    name: Attest candidate and create draft release
    if: needs.validate.outputs.is-release == 'true'
    needs: [assemble, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Select exact npm CLI
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          test "$(npm --version)" = "12.0.2"

      - name: Install the exact locked dependency graph
        run: npm ci --ignore-scripts

      - name: Download the exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: universal-ontology-mcp-server-release-candidate
          path: dist/releases

      - name: Reverify candidate bytes
        run: >-
          npm run mcp:release:verify --
          --tag "${{ github.ref_name }}"
          --release-directory dist/releases

      - name: Attest release build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/releases/SHA256SUMS

      - name: Attest release SPDX document
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/releases/SHA256SUMS
          sbom-path: dist/releases/universal-ontology-mcp-server-v1.0.0-release.spdx.json

      - name: Create or compare the draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_directory="dist/releases"
          remote_directory="${RUNNER_TEMP}/existing-release-assets"

          compare_existing_draft_asset() {
            local candidate_path="$1"
            local existing_path="$2"
            cmp --silent "${candidate_path}" "${existing_path}" || {
              echo "Existing draft asset differs: $(basename "${candidate_path}")" >&2
              return 1
            }
          }

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = "true"
            mkdir --parents "${remote_directory}"
            gh release download "${RELEASE_TAG}" --dir "${remote_directory}"
            for existing_path in "${remote_directory}"/*; do
              candidate_path="${release_directory}/$(basename "${existing_path}")"
              test -f "${candidate_path}"
              compare_existing_draft_asset "${candidate_path}" "${existing_path}"
            done
            for candidate_path in "${release_directory}"/*; do
              if test ! -f "${remote_directory}/$(basename "${candidate_path}")"; then
                gh release upload "${RELEASE_TAG}" "${candidate_path}"
              fi
            done
          else
            gh release create "${RELEASE_TAG}" "${release_directory}"/* \
              --draft \
              --verify-tag \
              --title "Universal Ontology MCP Server v${{ needs.validate.outputs.software-version }}" \
              --notes-file "${release_directory}/${RELEASE_TAG}-release-notes.md"
          fi

  publish-npm:
    name: Publish immutable npm package
    if: needs.validate.outputs.is-release == 'true'
    needs: [attest-and-draft, validate]
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Select exact npm CLI
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          test "$(npm --version)" = "12.0.2"

      - name: Install the exact locked dependency graph
        run: npm ci --ignore-scripts

      - name: Download the exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: universal-ontology-mcp-server-release-candidate
          path: dist/releases

      - name: Reverify candidate bytes
        run: >-
          npm run mcp:release:verify --
          --tag "${{ github.ref_name }}"
          --release-directory dist/releases

      - name: Determine whether the exact npm artifact already exists
        id: npm-publication
        shell: bash
        run: |
          set -euo pipefail
          package_specifier="universal-ontology-mcp-server@${{ needs.validate.outputs.software-version }}"
          tarball_path="dist/releases/universal-ontology-mcp-server-${{ needs.validate.outputs.software-version }}.tgz"
          candidate_integrity="$(node --input-type=module --eval 'import {createHash} from "node:crypto"; import {readFileSync} from "node:fs"; process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "${tarball_path}")"
          if remote_integrity="$(npm view "${package_specifier}" dist.integrity --json 2>/dev/null)"; then
            remote_integrity="${remote_integrity%\"}"
            remote_integrity="${remote_integrity#\"}"
            test "${remote_integrity}" = "${candidate_integrity}"
            echo "already-published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already-published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish with npm trusted publishing and provenance
        if: steps.npm-publication.outputs.already-published == 'false'
        run: >-
          npm publish
          dist/releases/universal-ontology-mcp-server-${{ needs.validate.outputs.software-version }}.tgz
          --access public
          --provenance

      - name: Verify published npm integrity
        shell: bash
        run: |
          set -euo pipefail
          tarball_path="dist/releases/universal-ontology-mcp-server-${{ needs.validate.outputs.software-version }}.tgz"
          candidate_integrity="$(node --input-type=module --eval 'import {createHash} from "node:crypto"; import {readFileSync} from "node:fs"; process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "${tarball_path}")"
          remote_integrity="$(npm view "universal-ontology-mcp-server@${{ needs.validate.outputs.software-version }}" dist.integrity --json)"
          remote_integrity="${remote_integrity%\"}"
          remote_integrity="${remote_integrity#\"}"
          test "${remote_integrity}" = "${candidate_integrity}"

  publish-oci:
    name: Publish immutable multi-platform OCI image
    if: needs.validate.outputs.is-release == 'true'
    needs: [attest-and-draft, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Select exact npm CLI
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          test "$(npm --version)" = "12.0.2"

      - name: Install the exact locked dependency graph
        run: npm ci --ignore-scripts

      - name: Download the exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: universal-ontology-mcp-server-release-candidate
          path: dist/releases

      - name: Rebuild and verify the canonical application bundle
        run: |
          npm run mcp:package:build
          npm run mcp:release:verify -- --tag "${{ github.ref_name }}" --release-directory dist/releases

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Derive OCI labels without a floating tag
        id: image-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/hadden-industries/universal-ontology-mcp-server
          flavor: latest=false
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.software-version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push the candidate by digest only
        id: build-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: packages/universal-ontology-mcp-server
          file: packages/universal-ontology-mcp-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/hadden-industries/universal-ontology-mcp-server,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.image-metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compare or create immutable OCI tags
        shell: bash
        run: |
          set -euo pipefail
          image_name="ghcr.io/hadden-industries/universal-ontology-mcp-server"
          candidate_digest="${{ steps.build-image.outputs.digest }}"

          inspect_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' |
              node --input-type=module --eval 'let text=""; for await (const chunk of process.stdin) text += chunk; process.stdout.write(JSON.parse(text).digest);'
          }

          for image_tag in "${{ needs.validate.outputs.software-version }}" "${GITHUB_SHA}"; do
            image_reference="${image_name}:${image_tag}"
            if existing_digest="$(inspect_digest "${image_reference}" 2>/dev/null)"; then
              test "${existing_digest}" = "${candidate_digest}"
            else
              docker buildx imagetools create \
                --tag "${image_reference}" \
                "${image_name}@${candidate_digest}"
            fi
            test "$(inspect_digest "${image_reference}")" = "${candidate_digest}"
          done

  publish-github-release:
    name: Publish verified GitHub Release
    if: needs.validate.outputs.is-release == 'true'
    needs: [attest-and-draft, publish-npm, publish-oci, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Select exact npm CLI
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          test "$(npm --version)" = "12.0.2"

      - name: Install the exact locked dependency graph
        run: npm ci --ignore-scripts

      - name: Download the exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: universal-ontology-mcp-server-release-candidate
          path: dist/releases

      - name: Reverify candidate and draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm run mcp:release:verify -- --tag "${{ github.ref_name }}" --release-directory dist/releases
          remote_directory="${RUNNER_TEMP}/draft-release-assets"
          mkdir --parents "${remote_directory}"
          gh release download "${{ github.ref_name }}" --dir "${remote_directory}"
          local_names="$(find dist/releases -maxdepth 1 -type f -printf '%f\n' | sort)"
          remote_names="$(find "${remote_directory}" -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "${local_names}" = "${remote_names}"
          while IFS= read -r candidate_path; do
            cmp --silent "${candidate_path}" "${remote_directory}/$(basename "${candidate_path}")"
          done < <(find dist/releases -maxdepth 1 -type f -print | sort)

      - name: Make the verified draft public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest=false

  publish-mcp-registry:
    name: Publish to the preview MCP Registry last
    if: needs.validate.outputs.is-release == 'true'
    needs: [publish-github-release, validate]
    runs-on: ubuntu-24.04
    environment: mcp-registry-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Select exact npm CLI
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          test "$(npm --version)" = "12.0.2"

      - name: Install the exact locked dependency graph
        run: npm ci --ignore-scripts

      - name: Download the exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: universal-ontology-mcp-server-release-candidate
          path: dist/releases

      - name: Reverify candidate bytes
        run: >-
          npm run mcp:release:verify --
          --tag "${{ github.ref_name }}"
          --release-directory dist/releases

      - name: Download and verify MCP Publisher 1.8.1
        shell: bash
        run: |
          set -euo pipefail
          publisher_archive="${RUNNER_TEMP}/mcp-publisher_linux_amd64.tar.gz"
          publisher_directory="${RUNNER_TEMP}/mcp-publisher"
          curl --fail --location --output "${publisher_archive}" "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  ${publisher_archive}" | sha256sum --check --strict
          mkdir --parents "${publisher_directory}"
          tar --extract --gzip --file "${publisher_archive}" --directory "${publisher_directory}" mcp-publisher
          chmod 0755 "${publisher_directory}/mcp-publisher"
          echo "${publisher_directory}" >> "${GITHUB_PATH}"

      - name: Compare or publish the exact Registry document
        shell: bash
        run: |
          set -euo pipefail
          registry_base_url="https://registry.modelcontextprotocol.io"
          registry_document_url="${registry_base_url}/v0.1/servers/io.github.hadden-industries%2Funiversal-ontology/versions/${{ needs.validate.outputs.software-version }}"
          remote_document="${RUNNER_TEMP}/registry-server-response.json"

          compare_registry_document() {
            node --input-type=module --eval '
              import { readFileSync } from "node:fs";
              const expected = JSON.parse(readFileSync("server.json", "utf8"));
              delete expected.$schema;
              const envelope = JSON.parse(readFileSync(process.argv[1], "utf8"));
              const actual = structuredClone(envelope.server ?? envelope);
              delete actual._meta;
              if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                throw new Error("Published MCP Registry document differs from the candidate.");
              }
            ' "${remote_document}"
          }

          response_status="$(curl --silent --show-error --location --output "${remote_document}" --write-out '%{http_code}' "${registry_document_url}")"
          if test "${response_status}" = "200"; then
            compare_registry_document
          elif test "${response_status}" = "404"; then
            # Use the publisher's official Registry default. The authenticated
            # token then binds publication to that same Registry origin.
            mcp-publisher login github-oidc
            mcp-publisher publish server.json
            curl --fail --location --output "${remote_document}" "${registry_document_url}"
            compare_registry_document
          else
            echo "MCP Registry lookup returned HTTP ${response_status}." >&2
            exit 1
          fi
