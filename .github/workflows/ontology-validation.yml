name: Enterprise Ontology Validation Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ontologies:
    name: OWL Differential Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Provision Python Runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Hydrate Runtime Dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null

          # Conditionally provision dependencies if a manifest boundary exists
          if [[ -f "requirements.txt" ]]; then
              pip install -r requirements.txt
          else
              echo "DEPENDENCY_STATE: No requirements.txt detected. Executing exclusively within Python standard library boundary."
          fi

      - name: Execute Deterministic Payload Validation
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              DIFF_BASE="${{ github.event.pull_request.base.sha }}"
          else
              DIFF_BASE="${{ github.event.before }}"
          fi

          python scripts/validate_ontologies.py --diff-base "${DIFF_BASE}" --diff-head "${{ github.sha }}"
