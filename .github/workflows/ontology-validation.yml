name: Enterprise Ontology Validation Pipeline
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    outputs:
      verified-revision:
        value: ${{ jobs.complete.outputs.verified-revision }}
permissions: {}
env:
  JENA_VERSION: 6.2.0
  JENA_SHA512: fb97634215b4667124bdbe4f42efc25d4dc4e9046b70bfa702d7a71e1a8aed049ec79a38eb469cf0e13b18724cc024adec3cc35113a24e8fa62aa66091d7431e
  JENA_SIGNER_FINGERPRINT: D99038A1731B8B31B71549EF04C95136D236A58F
  PR_CHECK_PLAN: ${{ inputs.plan }}
  PR_CHECK_MODE: ${{ fromJSON(inputs.plan).mode }}
jobs:
  validate-ontologies:
    timeout-minutes: 20
    name: OWL Differential Analysis
    runs-on: ubuntu-24.04
    outputs:
      ontology_policy_qa: ${{ steps.ontology_jobs.outputs.ontology_policy_qa }}
      ontology_entity_contracts: ${{ steps.ontology_jobs.outputs.ontology_entity_contracts }}
      ontology_qualification: ${{ steps.ontology_jobs.outputs.ontology_qualification }}
    env:
      ONTOLOGY_DIFF_BASE: ${{ fromJSON(inputs.plan).comparisonBase }}
      ONTOLOGY_DIFF_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - name: Select ontology jobs before provisioning their toolchains
        id: ontology_jobs
        run: node scripts/evaluatePullRequestChecks.js --scopes
      - name: Provision Python Runtime
        if: steps.ontology_jobs.outputs.ontology_validation == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - name: Create isolated Python environment
        if: steps.ontology_jobs.outputs.ontology_validation == 'true'
        run: python -m venv .venv
      - name: Select ontology validation before installing dependencies
        if: steps.ontology_jobs.outputs.ontology_validation == 'true'
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          args=(--diff-base "$ONTOLOGY_DIFF_BASE" --diff-head "$ONTOLOGY_DIFF_HEAD")
          if [[ "$PR_CHECK_MODE" == "full" ]]; then
            args=(--all-current)
          fi
          if [[ "${{ steps.ontology_jobs.outputs.ontology_validation_workflow }}" == "true" ]]; then
            args+=(--validation-workflow-changed)
          fi
          .venv/bin/python -B scripts/validate_ontologies.py "${args[@]}" --plan >> "$GITHUB_OUTPUT"
      - name: Install the hash-locked Python environment
        if: steps.scope.outputs.validation_required == 'true'
        run: .venv/bin/python -m pip install --require-hashes "--only-binary=:all:" --no-binary=pyyaml -r requirements.lock.txt
      - name: Test ontology validation runner
        if: steps.scope.outputs.validator_changed == 'true' && !fromJSON(inputs.plan).scopes.python_tests && !fromJSON(inputs.plan).scopes.development
        run: .venv/bin/python -B -m unittest discover -s tests -p test_validate_ontologies.py -v
      - name: Editing-policy draft diagnostics for the changed sources
        if: steps.scope.outputs.validation_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=(--diff-base "$ONTOLOGY_DIFF_BASE" --diff-head "$ONTOLOGY_DIFF_HEAD")
          if [[ "$PR_CHECK_MODE" == "full" ]]; then
            args=(--all-current)
          fi
          if [[ "${{ steps.ontology_jobs.outputs.ontology_validation_workflow }}" == "true" ]]; then
            args+=(--validation-workflow-changed)
          fi
          .venv/bin/python -B scripts/validate_ontologies.py "${args[@]}" --purpose draft --github-actions --report-directory policy-reports
      - name: Retain policy reports
        if: always() && steps.scope.outputs.validation_required == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-reports-differential
          path: policy-reports
          if-no-files-found: ignore
      - name: Report unchanged ontology inputs
        if: steps.ontology_jobs.outputs.ontology_validation == 'false' || steps.scope.outputs.validation_required == 'false'
        run: echo "Ontology validation not applicable; no supported ontology or validator input changed."
    permissions:
      contents: read
    cache-mode: none
  policy-qa:
    timeout-minutes: 30
    name: Editing policy QA
    needs: validate-ontologies
    if: ${{ !cancelled() && (needs.validate-ontologies.outputs.ontology_policy_qa == 'true' || needs.validate-ontologies.outputs.ontology_entity_contracts == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - name: Install the hash-locked Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes "--only-binary=:all:" --no-binary=pyyaml -r requirements.lock.txt
          .venv/bin/python -m pip check
      - name: Select package manager
        if: needs.validate-ontologies.outputs.ontology_policy_qa == 'true'
        shell: bash
        run: |
          npm install --global --no-audit --no-fund npm@12.2.0
          test "$(npm --version)" = "12.2.0"
      - name: Generated policy is current
        if: needs.validate-ontologies.outputs.ontology_policy_qa == 'true'
        run: |
          npm run install:markdown
          .venv/bin/python -B scripts/render_editing_policy.py --check
      - name: Policy, rendering, authority, change and publication-gate contracts
        if: (needs.validate-ontologies.outputs.ontology_policy_qa == 'true') && !fromJSON(inputs.plan).scopes.python_tests
        run: .venv/bin/python -B -m unittest discover -s tests -p "test_*polic*.py" -v
      - name: Entity change and publication gate contracts
        if: (needs.validate-ontologies.outputs.ontology_policy_qa == 'true' || needs.validate-ontologies.outputs.ontology_entity_contracts == 'true') && !fromJSON(inputs.plan).scopes.python_tests
        run: .venv/bin/python -B -W "ignore:'count' is passed as positional argument:DeprecationWarning:rdflib.plugins.sparql.operators" -m unittest tests.test_ontology_entity_changes tests.test_publication_gate -v
    permissions:
      contents: read
  qualify:
    timeout-minutes: 45
    name: Latest-active qualification (${{ matrix.os }})
    needs: validate-ontologies
    if: ${{ !cancelled() && needs.validate-ontologies.outputs.ontology_qualification == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify plan and checkout identity
        run: node scripts/evaluatePullRequestChecks.js --verify
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - name: Provision the qualified Temurin JDK
        id: java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .java-version
          check-latest: false
          verify-signature: true
      - name: Cache the verified Jena distribution
        id: jena-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .agent-tools/jena/apache-jena-${{ env.JENA_VERSION }}
          key: jena-${{ env.JENA_VERSION }}-${{ env.JENA_SHA512 }}-${{ runner.os }}-${{ runner.arch }}
      - name: Download and verify Apache Jena
        if: steps.jena-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-tools/jena && cd .agent-tools/jena
          base="https://downloads.apache.org/jena/binaries"
          curl -sSfL -o jena.zip "$base/apache-jena-${JENA_VERSION}.zip"
          curl -sSfL -o jena.zip.asc "$base/apache-jena-${JENA_VERSION}.zip.asc"
          curl -sSfL -o KEYS "https://downloads.apache.org/jena/KEYS"
          echo "${JENA_SHA512}  jena.zip" | sha512sum -c -
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --quiet --import KEYS
          gpg --batch --status-fd 1 --verify jena.zip.asc jena.zip | tee verify.log
          grep -q "VALIDSIG ${JENA_SIGNER_FINGERPRINT}" verify.log
          unzip -q jena.zip
          test -d "apache-jena-${JENA_VERSION}/lib"
      - name: Install the hash-locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=.venv/Scripts/python.exe; fi
          "$py" -m pip install --require-hashes "--only-binary=:all:" --no-binary=pyyaml -r requirements.lock.txt
          "$py" -m pip check
          echo "PY=$py" >> "$GITHUB_ENV"
      - name: Record runtime identities
        shell: bash
        run: |
          "$PY" --version
          java -version 2>&1 | head -1
          java -cp ".agent-tools/jena/apache-jena-${JENA_VERSION}/lib/*" jena.version
      - name: Qualify the complete latest active set (pySHACL)
        shell: bash
        run: '"$PY" -B scripts/validate_ontologies.py --purpose latest-active --github-actions --report-directory policy-reports'
      - name: Cross-engine parity (Apache Jena)
        shell: bash
        env:
          UNIVERSAL_ONTOLOGY_JENA_HOME: ${{ github.workspace }}/.agent-tools/jena/apache-jena-${{ env.JENA_VERSION }}
          UNIVERSAL_ONTOLOGY_JAVA_HOME: ${{ steps.java.outputs.path }}
        run: '"$PY" -B -m unittest tests.test_ontology_policy_engines -v'
      - name: Retain qualification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-reports-${{ matrix.os }}
          path: policy-reports
          if-no-files-found: ignore
    permissions:
      contents: read
  complete:
    name: Verify internal completion
    if: ${{ always() }}
    needs:
      - validate-ontologies
      - policy-qa
      - qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    cache-mode: none
    outputs:
      verified-revision: ${{ steps.complete.outputs.verified-revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: complete
        if: ${{ success() && !cancelled() }}
        env:
          PR_CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/evaluatePullRequestChecks.js --consumer ontology
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        run: exit 1
defaults:
  run:
    shell: bash
cache-mode: read
