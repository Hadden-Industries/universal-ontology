name: Set up repository Python
description: Provision the repository-selected Python in an isolated hosted environment
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.0"
        activate-environment: true
        venv-path: ${{ runner.temp }}/python
        no-project: true
        enable-cache: false
