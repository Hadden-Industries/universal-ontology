name: Set up repository Python
description: Provision the repository-selected Python in an isolated hosted environment
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.13.5"
        activate-environment: true
        venv-path: ${{ runner.temp }}/python
        no-project: true
        enable-cache: false
