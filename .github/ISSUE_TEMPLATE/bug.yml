name: Bug report
description: Something behaves differently from what you expected.
title: "[Bug]: "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What happened, including any output or error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected instead, and why (documentation, source, prior behaviour).
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Steps, input, command or request that triggers it. Say if it is intermittent.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit or release, operating system, runtime or browser, and relevant configuration, when they matter.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and impact
      description: Logs, screenshots, failing tests or identifiers, and how much this affects you. Leave out secrets and unnecessary personal data.
    validations:
      required: false
