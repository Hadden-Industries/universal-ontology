name: Change proposal
description: Propose a correction, addition or other change.
title: "[Change]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing, and who is affected.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed result
      description: What should be different afterwards. Alternatives you considered are welcome.
    validations:
      required: true

  - type: textarea
    id: semantics
    attributes:
      label: Semantic or compatibility concerns
      description: For ontology changes, the intended meaning and sources; for other changes, affected identifiers, interfaces or consumers. Optional.
    validations:
      required: false
